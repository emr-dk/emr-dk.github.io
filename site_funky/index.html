<body>
  <section class="section" id="rain-container">
    <nav class="page-dots" aria-label="Sidenavigation">
      <a href="/site_colorful/"    class="pd-arrow" aria-label="Forrige side">&lt;</a>
      <a href="/site_colorful/"    class="pd-dot" aria-label="Side 1"></a>
      <a href="/site_funky/"       class="pd-dot" aria-current="page" aria-label="Side 2"></a>

      <a href="/site_old_school/"  class="pd-dot" aria-label="Side 6"></a>
      <a href="/site_minimalist/"  class="pd-dot" aria-label="Side 7"></a>
      <a href="/site_design/"      class="pd-dot" aria-label="Side 8"></a>
      <a href="/site_terminal/"    class="pd-arrow" aria-label="Næste side">&gt;</a>
    </nav>

    <div class="funky-name">
      <span class="funky-main">Emil Møller</span>
      <span class="funky-sub">Rasmussen</span>
    </div>
  </section>

  <script>
    // Only devicon classes — custom icon-* classes have no font loaded
    const list_elements = [
      'devicon-pandas-original',
      'devicon-git-plain',
      'devicon-postgresql-plain',
      'devicon-python-plain',
      'devicon-jupyter-plain',
      'devicon-linux-plain',
      'devicon-rstudio-plain',
      'devicon-pytorch-original',
      'devicon-bash-plain',
      'devicon-docker-plain',
      'devicon-flask-original',
      'devicon-go-plain',
    ];

    const colors = ['#fcf3e0', '#e5f2e4', '#f7ba84', '#a9def9', '#fcf6bd'];
    const element = document.querySelector('#rain-container');

    function getRndInteger(min, max) {
      return Math.floor(Math.random() * (max - min)) + min;
    }

    function createRain() {
      // Always read current width so it stays correct after resize
      const viewPortWidth = document.documentElement.clientWidth;
      const icon_name = list_elements[getRndInteger(0, list_elements.length)];
      const color = colors[getRndInteger(0, colors.length)];
      const left = getRndInteger(0, viewPortWidth);

      const spanner = document.createElement('span');
      spanner.className = 'icon is-large skills-special rain';
      spanner.style.left = left + 'px';
      spanner.style.backgroundColor = color;

      const icon = document.createElement('i');
      icon.className = icon_name;
      spanner.appendChild(icon);
      element.appendChild(spanner);

      // Remove from DOM once the fall animation finishes — no accumulation
      spanner.addEventListener('animationend', () => spanner.remove());
    }

    createRain();
    window.setInterval(createRain, 1000);
  </script>
</body>
</html>
