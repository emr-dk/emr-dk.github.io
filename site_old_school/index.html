  <div id="terminal"></div>

  <script>
    const lines = [
      { text: "EMIL/BIOS v2.1  Copyright (C) 1994 Emil Corp.", cls: "cyan", pause: 80 },
      { text: "640K Base Memory, Extended: COFFEE-DEPENDENT", pause: 60 },
      { text: "", pause: 40 },
      { text: "Detecting hardware...", pause: 350 },
      { text: "  [OK]  KEYBOARD ............. detected", cls: "green", pause: 110 },
      { text: "  [OK]  DISPLAY .............. CRT 80x25", cls: "green", pause: 110 },
      { text: "  [OK]  HARD DISK ............ SKILLS.DAT", cls: "green", pause: 110 },
      { text: "  [OK]  SOUND CARD ........... CLARINET v1.0", cls: "green", pause: 110 },
      { text: "  [OK]  NETWORK .............. DENMARK", cls: "green", pause: 250 },
      { text: "", pause: 40 },
      { text: "Loading ABOUT.SYS", pause: 0, ellipsis: true, ellipsisPause: 600 },
      { text: "", pause: 40 },
      { text: "C:\\> dir", cls: "green", pause: 300 },
      { text: "", pause: 40 },
      { text: " Volume in drive C is EMIL      Serial No. 1994-DK", pause: 60 },
      { text: " Directory of C:\\ABOUT", pause: 80 },
      { text: "", pause: 40 },
      { text: " [GIS        ] [PYTHON     ] [DATA_ENG   ] [POSTGRESQL ]", cls: "cyan", pause: 70 },
      { text: " [JAVASCRIPT ] [DOCKER     ] [LINUX      ] [RAG_AI     ]", cls: "cyan", pause: 70 },
      { text: " [CLARINET   ] [BOOKS      ] [HIKING     ] [FAMILY     ]", cls: "cyan", pause: 70 },
      { text: " [STATISTICS ] [GEOGRAPHY  ] [GO         ] [C#         ]", cls: "cyan", pause: 150 },
      { text: "", pause: 40 },
      { text: "        16 dir(s)       0 bytes free", pause: 250 },
      { text: "", pause: 40 },
      { text: "C:\\ABOUT> type README.TXT", cls: "green", pause: 400 },
      { text: "", pause: 40 },
      { text: "  NAME ...... Emil Møller Rasmussen", pause: 70 },
      { text: "  ROLE ...... Data Engineer & GIS Specialist", pause: 70 },
      { text: "  ORIGIN .... Denmark", pause: 70 },
      { text: "  LIKES ..... Geography, Music, Culture, Outdoors", pause: 200 },
      { text: "", pause: 40 },
      { text: "C:\\ABOUT> _", cls: "green", pause: 0, cursor: true },
    ];

    const terminal = document.getElementById("terminal");
    let i = 0;

    function printNext() {
      if (i >= lines.length) return;
      const line = lines[i++];

      const el = document.createElement("div");
      el.className = "line";

      if (line.cursor) {
        el.innerHTML = '<span class="' + (line.cls || "") + '">' + line.text.slice(0, -1) + '</span><span class="cursor"></span>';
        terminal.appendChild(el);
        return;
      }

      if (line.ellipsis) {
        el.innerHTML = '<span>' + line.text + '</span><span class="ellipsis-dots"></span>';
        terminal.appendChild(el);
        animateEllipsis(el.querySelector(".ellipsis-dots"), line.ellipsisPause || 800, printNext);
        return;
      }

      el.innerHTML = line.text
        ? '<span class="' + (line.cls || "") + '">' + line.text + '</span>'
        : '&nbsp;';
      terminal.appendChild(el);

      terminal.scrollTop = terminal.scrollHeight;
      setTimeout(printNext, line.pause || 60);
    }

    function animateEllipsis(el, totalPause, cb) {
      const dots = [".", "..", "..."];
      let d = 0;
      const iv = setInterval(() => {
        el.textContent = dots[d % dots.length];
        d++;
      }, 180);
      setTimeout(() => {
        clearInterval(iv);
        el.textContent = "...";
        cb();
      }, totalPause);
    }

    window.addEventListener("load", () => setTimeout(printNext, 300));
  </script>
